<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Let's Link — Austin, TX</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#0d0f14; --card:#171b23; --card2:#1f2430; --line:#2a3140;
  --ink:#eef1f6; --sub:#9aa4b6; --dim:#6b7688;
  --brand:#00c2a8; --brand2:#7c5cff; --gold:#ffb020; --danger:#ff5470;
  --shadow:0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#05070a;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
#phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);
  position:relative;overflow:hidden;box-shadow:var(--shadow);}
/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:rgba(13,15,20,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo b{background:linear-gradient(90deg,var(--brand),var(--brand2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:12px;color:#06121a;flex:0 0 auto}
/* Content */
#view{padding:14px 14px 96px;min-height:60vh}
.h1{font-size:22px;font-weight:800;margin:6px 2px 4px;letter-spacing:-.4px}
.sub{color:var(--sub);font-size:13px;margin:0 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.card .pad{padding:13px 14px}
.banner{height:120px;background:linear-gradient(135deg,var(--brand2),var(--brand));
  position:relative;display:flex;align-items:flex-end;padding:12px}
.banner.fest{background:linear-gradient(135deg,#ff6a3d,#ffb020 70%,#7c5cff)}
.banner.biz{background:linear-gradient(135deg,#2b5876,#4e4376)}
.banner .tag{background:rgba(0,0,0,.5);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:600}
.title{font-size:17px;font-weight:700;margin:0 0 3px}
.meta{color:var(--sub);font-size:12.5px;margin:0}
.row{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);
  border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px;
  color:var(--sub);margin:0 6px 6px 0;cursor:pointer}
.chip.on{background:var(--brand);color:#05141a;border-color:var(--brand);font-weight:700}
.stars{color:var(--gold);font-size:13px;font-weight:700}
.social{display:flex;align-items:center;gap:-8px;margin:8px 0 2px}
.social .avatar{width:26px;height:26px;font-size:11px;margin-left:-8px;border:2px solid var(--card)}
.social .avatar:first-child{margin-left:0}
.social .who{margin-left:10px;font-size:12.5px;color:var(--sub)}
.social .who b{color:var(--ink)}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:12px;
  border:none;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:4px}
.btn.p{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#05141a}
.btn.g{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:linear-gradient(90deg,#ff6a3d,var(--gold));color:#2a1600}
.sect{font-size:13px;font-weight:800;color:var(--sub);text-transform:uppercase;
  letter-spacing:.6px;margin:20px 2px 10px;display:flex;align-items:center;gap:7px}
.eco{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer}
.eco .ic{width:38px;height:38px;border-radius:10px;background:var(--card2);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.eco .nm{font-weight:600;font-size:14px}
.eco .ds{color:var(--dim);font-size:12px;margin-top:1px}
.eco .go{margin-left:auto;color:var(--dim);font-size:18px}
.review{padding:13px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;margin-bottom:10px;box-shadow:var(--shadow)}
.review .top{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.review .nm{font-weight:600;font-size:13px}
.review .fol{font-size:10.5px;color:var(--brand);background:rgba(0,194,168,.12);
  padding:2px 7px;border-radius:10px;margin-left:auto;font-weight:600}
.review .tx{font-size:13px;color:var(--sub);line-height:1.45}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:22px 10px;font-style:italic}
/* search */
.searchwrap{display:flex;align-items:center;gap:8px;background:var(--card2);
  border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin:2px 2px 16px}
.searchwrap .si{font-size:14px;opacity:.7}
.search{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:14px}
.search::placeholder{color:var(--dim)}
.searchwrap .sx{color:var(--dim);font-size:14px;cursor:pointer;padding:0 2px}
/* tiles */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}
.tile.big{grid-column:1/-1;margin-bottom:2px}
.tileimg{height:110px;position:relative;display:flex;align-items:flex-start;padding:9px;background-color:#1a1f2a}
.tile.big .tileimg{height:150px}
.tileimg .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 45%,rgba(0,0,0,.25))}
.tileimg>span:not(.scrim){z-index:2}
/* sort bar */
.sortbar{display:flex;gap:7px;overflow-x:auto;padding:0 2px 12px;-webkit-overflow-scrolling:touch}
.sortbar::-webkit-scrollbar{display:none}
.sortchip{white-space:nowrap;background:var(--card2);border:1px solid var(--line);
  border-radius:20px;padding:7px 13px;font-size:12.5px;color:var(--sub);cursor:pointer;flex:0 0 auto}
.sortchip.on{background:var(--brand);color:#05141a;border-color:var(--brand);font-weight:700}
/* event mode toggle */
.modebar{display:flex;gap:8px;margin:4px 2px 6px}
.modebtn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--sub);font-size:13.5px;font-weight:700;cursor:pointer}
.modebtn.on{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#05141a;border-color:transparent}
.modehint{color:var(--dim);font-size:12px;margin:0 4px 12px;line-height:1.4}
/* user profile breakdown */
.phero{position:relative;height:120px;border-radius:16px 16px 0 0;overflow:hidden}
.phero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.5))}
.pbody{background:var(--card);border:1px solid var(--line);border-top:none;
  border-radius:0 0 16px 16px;padding:0 14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.pav{margin-top:-34px;position:relative;z-index:2}
.socialrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 2px}
.soc{display:inline-flex;align-items:center;gap:6px;background:var(--card2);
  border:1px solid var(--line);border-radius:20px;padding:7px 12px;font-size:12px;
  color:var(--ink);cursor:pointer;text-decoration:none}
.soc .sg{font-size:13px}
.locked{background:var(--card2);border:1px dashed var(--line);border-radius:14px;
  padding:22px 16px;text-align:center;margin-top:12px}
.locked .lk{font-size:26px}
.locked .lt{font-weight:700;margin:8px 0 3px;font-size:14px}
.locked .ls{color:var(--dim);font-size:12.5px;line-height:1.45}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.pbeen{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.pbeen .pi{height:80px;position:relative}
.pbeen .pi .scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.4))}
.pbeen .pn{padding:8px 10px}
.pbeen .pnn{font-size:12.5px;font-weight:600}
.pbeen .pnr{font-size:11px;color:var(--gold);font-weight:700;margin-top:2px}
.photostrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.photostrip::-webkit-scrollbar{display:none}
.pshot{flex:0 0 auto;width:110px;height:110px;border-radius:12px;background-size:cover;
  background-position:center;border:1px solid var(--line)}
.statrow{display:flex;gap:10px;margin:12px 0 4px}
.stat{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--dim)}
/* badges: one per corner, never share a row, distance never wraps */
.tileimg .badge{position:absolute !important;top:7px;left:7px;max-width:60%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;background:rgba(0,0,0,.62);border-radius:14px;
  padding:3px 8px;font-size:10px;font-weight:600;backdrop-filter:blur(4px);line-height:1.3;z-index:3}
.tileimg .rate{position:absolute !important;top:7px;right:7px;background:rgba(0,0,0,.62);
  color:var(--gold);border-radius:14px;padding:3px 8px;font-size:10.5px;font-weight:800;
  backdrop-filter:blur(4px);white-space:nowrap;line-height:1.3;z-index:3}
.tileimg .dist{position:absolute !important;bottom:7px;left:7px;background:rgba(0,0,0,.62);
  border-radius:14px;padding:3px 8px;font-size:10px;font-weight:700;backdrop-filter:blur(4px);
  white-space:nowrap;line-height:1.3;z-index:3}
.tileimg .stack{position:absolute !important;bottom:7px;right:7px;display:flex;z-index:3}
.tileimg .stack .avatar{margin-left:-8px;border:2px solid rgba(0,0,0,.3)}
.tileimg .stack .avatar:first-child{margin-left:0}
.cap{padding:10px 11px 12px}
.capttl{font-weight:700;font-size:14.5px;line-height:1.2;margin-bottom:3px}
.tile.big .capttl{font-size:18px}
.capline{color:var(--sub);font-size:12px;line-height:1.35;margin-bottom:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.caploc{color:var(--brand);font-size:11.5px;font-weight:600}
/* following activity cards */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.fhead{display:flex;align-items:center;gap:10px;padding:12px 13px;cursor:pointer;
  border-bottom:1px solid var(--line)}
.flist{padding:6px 8px 8px}
.act{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:10px;cursor:pointer}
.act:hover{background:var(--card2)}
.actt{font-size:11px;font-weight:800;color:var(--brand);white-space:nowrap;flex:0 0 auto}
.actx{font-size:12.5px;color:var(--sub);line-height:1.35;flex:1}
.actgo{color:var(--dim);font-size:16px;flex:0 0 auto}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:13px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow)}
.why{font-size:13px;color:var(--ink);line-height:1.45;background:var(--card2);
  border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.whyact{font-size:11.5px;color:var(--dim);margin-top:7px;font-style:italic}
.backbtn{background:none;border:none;color:var(--brand);font-size:14px;font-weight:600;
  padding:2px 0 12px;cursor:pointer;display:flex;align-items:center;gap:5px}
/* Bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:rgba(13,15,20,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 4px 22px;z-index:30}
.nav button{background:none;border:none;color:var(--dim);font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1}
.nav button .i{font-size:20px}
.nav button.on{color:var(--brand)}
/* toast */
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--brand);color:#05141a;font-weight:700;font-size:13px;padding:11px 18px;
  border-radius:24px;opacity:0;transition:.3s;z-index:50;pointer-events:none;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none;align-items:flex-end}
#sheet.show{display:flex}
.sheetbox{background:var(--card);width:100%;max-width:430px;margin:0 auto;
  border-radius:20px 20px 0 0;padding:18px 16px 32px;animation:up .25s ease;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheetbox::-webkit-scrollbar{width:0}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheetbox h3{margin:2px 0 3px;font-size:17px}
.opt{padding:14px;border:1px solid var(--line);border-radius:12px;margin-top:10px;
  display:flex;align-items:center;gap:11px;cursor:pointer;font-size:14px}
.opt .i{font-size:19px}
.opt small{color:var(--dim);display:block;font-size:11.5px;margin-top:1px}
.pill{font-size:11px;color:var(--gold);background:rgba(255,176,32,.12);padding:3px 9px;border-radius:10px;font-weight:600}
.finput{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;
  padding:12px;font-size:14px;color:var(--ink);margin-bottom:9px;font-family:inherit;outline:none}
.finput::placeholder{color:var(--dim)}
.finfo{font-size:12px;color:var(--dim);background:var(--card2);border:1px dashed var(--line);
  border-radius:11px;padding:10px 12px;line-height:1.4}
.createrow{display:flex;gap:10px;margin:2px 0}
.createbtn{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:15px 10px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.createbtn .ci{font-size:24px}
.createbtn .ct{font-weight:700;font-size:13.5px;margin-top:5px}
.createbtn .cs{font-size:11px;color:var(--dim);margin-top:2px}
.endrow{display:flex;align-items:center;gap:11px;padding:13px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;cursor:pointer;box-shadow:var(--shadow)}
.endrow .ei{font-size:20px}
.endrow .en{font-weight:700;font-size:14px}
.endrow .es{font-size:12px;color:var(--dim);margin-top:1px}
.endrow .eg{margin-left:auto;color:var(--dim);font-size:18px}
/* booking fee + criteria */
.feebox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:4px 0 10px}
.feerow{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.feeamt{font-size:20px;font-weight:800;color:var(--brand)}
.feeunit{font-size:12px;color:var(--sub)}
.feepill{margin-left:auto;font-size:10.5px;color:var(--gold);background:rgba(255,176,32,.12);
  padding:3px 9px;border-radius:10px;font-weight:600}
.feemin{font-size:12px;color:var(--dim);margin-top:6px}
.crit{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--sub);
  line-height:1.45;padding:5px 0}
.crit .critc{color:var(--brand);font-weight:800;flex:0 0 auto}
/* business account toggle */
.bizacct{background:linear-gradient(135deg,rgba(0,194,168,.12),rgba(124,92,255,.12));
  border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.bizacct .bh{display:flex;align-items:center;gap:10px}
.bizacct .bi{font-size:22px}
.bizacct .bt{font-weight:700;font-size:14.5px}
.bizacct .bd{font-size:12px;color:var(--sub);margin-top:2px}
.toggle{margin-left:auto;width:46px;height:27px;border-radius:20px;background:var(--card2);
  border:1px solid var(--line);position:relative;cursor:pointer;flex:0 0 auto;transition:.2s}
.toggle.on{background:var(--brand)}
.toggle .knob{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:#fff;transition:.2s}
.toggle.on .knob{left:22px}
.bkfield{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-top:9px}
.bkfield .bl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.bkfield .bv{font-size:14px;margin-top:3px}
/* create form sections + uploader */
.fsec{font-size:12px;font-weight:800;color:var(--brand);text-transform:uppercase;
  letter-spacing:.5px;margin:14px 0 7px}
.uploader{border:1.5px dashed var(--line);border-radius:12px;padding:18px 12px;text-align:center;
  cursor:pointer;background:var(--card2)}
.uploader .upi{font-size:26px}
.uploader .upt{font-weight:700;font-size:13.5px;margin-top:5px}
.uploader .ups{font-size:11.5px;color:var(--dim);margin-top:2px}
.upfile{font-size:12.5px;color:var(--sub);background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:8px 11px;margin-top:8px}
.docrow{font-size:13px;color:var(--sub);padding:6px 0;display:flex;gap:8px;align-items:center}
.me{cursor:pointer}
/* account dropdown menu */
.mhead{display:flex;align-items:center;gap:10px;padding:2px 2px 4px}
.mdiv{height:1px;background:var(--line);margin:10px -16px}
.mopt{display:flex;align-items:center;gap:12px;padding:13px 6px;cursor:pointer;
  font-size:14.5px;border-radius:10px}
.mopt:hover{background:var(--card2)}
.mopt .mi{font-size:18px;width:24px;text-align:center;flex:0 0 auto}
.mopt .mg{margin-left:auto;color:var(--dim);font-size:16px}
.mopt.md{color:var(--danger)}
/* category filter bar */
.catbar{display:flex;gap:7px;overflow-x:auto;padding:0 2px 12px;-webkit-overflow-scrolling:touch}
.catbar::-webkit-scrollbar{display:none}
.catchip{white-space:nowrap;background:var(--card2);border:1px solid var(--line);
  border-radius:20px;padding:7px 13px;font-size:12.5px;color:var(--sub);cursor:pointer;flex:0 0 auto}
.catchip.on{background:linear-gradient(90deg,var(--brand),var(--brand2));color:#05141a;
  border-color:transparent;font-weight:700}
/* board / marketplace cards */
.bcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:13px 14px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow)}
.bctop{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.pbadge{width:38px;height:38px;border-radius:11px;background:var(--card2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.bcby{font-weight:700;font-size:14px}
.bcmeta{font-size:11.5px;color:var(--dim);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ktag{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;flex:0 0 auto}
.ktag.offer{color:#05141a;background:var(--brand)}
.ktag.req{color:#2a1600;background:var(--gold)}
.bctitle{font-weight:700;font-size:15px;margin-bottom:4px;line-height:1.25}
.bcbody{font-size:12.5px;color:var(--sub);line-height:1.45;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bcfoot{display:flex;align-items:center;gap:8px}
.bcwhen{font-size:11.5px;color:var(--dim)}
.bccta{margin-left:auto;font-size:12px;font-weight:700;color:var(--brand)}
.sheetbox h3{position:sticky;top:-18px;background:var(--card);margin:-2px -16px 3px;padding:6px 16px 8px;z-index:5}
.sheetactions{position:sticky;bottom:-32px;background:var(--card);margin:8px -16px -32px;padding:12px 16px 32px;
  box-shadow:0 -8px 16px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="phone">
  <div class="topbar">
    <div class="logo">Let's<b>Link</b> <span style="font-size:9px;color:#00c2a8;font-weight:600;vertical-align:top">v22</span></div>
    <div class="me" data-act="openMenu">
      <span id="meName">Keith</span>
      <span class="avatar" id="meAv" style="background:#ffb020">K</span>

  if(/kayak|outdoor|rental|paddle|park/.test(c))return"outdoors";
  if(/gallery|art|attraction/.test(c))return"local";

// One global click listener. Elements carry data-act + data-args; no inline onclick needed.
document.addEventListener("click",function(ev){
  const el=ev.target.closest("[data-act]");
  if(!el)return;
  const act=el.getAttribute("data-act");
  const args=(el.getAttribute("data-args")||"").split("|");
  ev.stopPropagation();
  try{ ACTIONS[act]&&ACTIONS[act].apply(null,args); }
  catch(e){ const v=document.getElementById("view"); if(v)v.innerHTML='<div style="padding:20px;color:#ff5470;font-family:monospace;font-size:13px">Action error: '+act+' — '+e.message+'</div>'; }
});

  return `data-act="${act}" data-args="${args}"`;}

function postByName(p){
  if(users[p.by])return users[p.by].name;
  if(biz[p.by])return biz[p.by].n;
  return p.by;
}
function postAvatar(p){
  if(p.bizref&&biz[p.bizref])return `<div class="pbadge">${biz[p.bizref].ic}</div>`;
  if(users[p.by])return av(p.by,38);
  return `<div class="pbadge">🏢</div>`;
}
function postCard(p){
  const kindLabel=p.kind==="offer"?'<span class="ktag offer">✅ Available</span>':'<span class="ktag req">🙋 Looking for</span>';
  const catMeta=CATS.find(c=>c[0]===p.cat)||["","🌐",""];
  return `<div class="bcard" ${da('openPost',p.id)}>
    <div class="bctop">${postAvatar(p)}
      <div style="flex:1;min-width:0">

    return true;
  });
  const offers=posts.filter(p=>p.kind==="offer").length, reqs=posts.filter(p=>p.kind==="request").length;

/* ============ EVENT DETAIL (the hero) ============ */
function renderEvent(id){
  const e=events[id];const host=users[e.host]||{name:biz[e.host]?.n||e.host};
  const fa=friendsAttending(id);const going=attending[id];
  // classify each eco section into TO-DO (what to enjoy) vs HIRE (services/support you can book)
  const HIRE_SECTS=["🛡️ Staff & Services"];
  const HIRE_CATS=/security|landscap|photo|staff|grounds|medic/i;
  function sectMode(sect){return HIRE_SECTS.includes(sect)?"hire":"todo";}
  function itemIsHire(sect,ref){const b=biz[ref];
    if(sectMode(sect)==="hire")return true;
    return b&&HIRE_CATS.test(b.cat);}

  function ecoTile(ref,role){
    const b=biz[ref],u=users[ref];
    if(b)return `<div class="tile" ${da('open','biz',ref)}>
      <div class="tileimg" style="${imgStyle(photoUrl(ref,300,180),posterFor(b.cat),78)}">
        <span class="scrim"></span><span class="badge">${b.ic}</span><span class="rate">★ ${b.r}</span></div>
      <div class="cap"><div class="capttl" style="font-size:13px">${b.n}</div>
      <div class="caploc">${role}</div></div></div>`;
    if(u)return `<div class="tile" ${da('open','user',ref)}>
      <div class="tileimg" style="${imgStyle(uphoto(ref),POSTER.music,78,'center top')}"><span class="scrim"></span></div>
      <div class="cap"><div class="capttl" style="font-size:13px">${u.name}</div>
      <div class="caploc">${role}</div></div></div>`;
    return `<div class="tile" style="opacity:.75">
      <div class="tileimg" style="height:78px;background:${POSTER.event};align-items:center;justify-content:center;font-size:24px">✨</div>
      <div class="cap"><div class="capttl" style="font-size:13px">${ref}</div>
      <div class="caploc" style="color:var(--dim)">${role}</div></div></div>`;}

  let eco="";
  for(const[sect,items]of Object.entries(e.eco||{})){
    const kept=items.filter(([ref,role])=>{
      const isHire=itemIsHire(sect,ref);
      return eventMode==="hire"?isHire:!isHire;
    });
    if(!kept.length)continue;
    eco+=`<div class="sect">${sect}</div><div class="grid">`;
    eco+=kept.map(([ref,role])=>ecoTile(ref,role)).join("")+`</div>`;
  }
  if(!eco)eco=`<div class="empty">Nothing in this view yet.</div>`;

  const modeBar=e.hero?`<div class="modebar">
    <button class="modebtn ${eventMode==='todo'?'on':''}" ${da('setEventMode','todo')}>🎉 What to do</button>
    <button class="modebtn ${eventMode==='hire'?'on':''}" ${da('setEventMode','hire')}>🤝 Hire & support</button>
  </div>
  <p class="modehint">${eventMode==='todo'?'Everything to see, hear, eat & enjoy at '+e.n+'.':'The vendors, crews & talent behind '+e.n+' — tap any to book or hire.'}</p>`:'';

  setView(`<button class="backbtn" ${da('back')}>‹ Back</button>
  <div class="card"><div class="banner" style="${imgStyle(photoUrl(id,800,400),e.hero?POSTER.fest:POSTER.event)};height:150px"><span class="scrim"></span><span class="tag" style="position:relative;z-index:2">${e.hero?'⭐ Hero event':'Event'}</span></div>
  <div class="pad">
    <div class="title" style="font-size:20px">${e.hero?'🎪 ':''}${e.n}</div>
    <p class="meta">${e.date}</p><p class="meta">📍 ${e.loc} · <b style="color:var(--brand)">${miles(id)} away</b></p>
    <div class="row" style="margin:9px 0" ${da('open','user',e.host)} >
      ${users[e.host]?av(e.host):'<span class="ic" style="width:26px;height:26px;font-size:14px">🏢</span>'}
      <span class="meta">Hosted by <b style="color:var(--ink)">${host.name}</b></span></div>
    <p class="meta" style="line-height:1.5;color:var(--sub);margin:8px 0 12px">${e.d}</p>
    ${fa.length?`<div class="social">${fa.map(u=>av(u)).join("")}<span class="who"><b>${fa.map(u=>users[u].name.split(" ")[0]).join(", ")}</b> ${fa.length>1?'are':'is'} going</span></div>`:''}
    <button class="btn ${going?'g':'gold'}" ${da('markAttending',id)}>${going?'✓ You are going — tap to manage':'＋ Mark attending'}</button>
  </div></div>
  ${modeBar}
  ${eco}
  <div style="height:10px"></div>`);
}
function setEventMode(m){eventMode=m;render();}

  if(!visible){
    html+=`<div class="locked">
      <div class="lk">🔒</div>
      <div class="lt">${u.name.split(" ")[0]}'s activity is private</div>
      <div class="ls">Follow them (or get added as a close friend) to see where they've been, their reviews, and photos they've posted.</div>
      <button class="btn p" style="margin-top:12px;max-width:220px;margin-left:auto;margin-right:auto" ${da('toast','Follow request sent to '+u.name)}>＋ Follow to unlock</button>

    setView(html);return;
  }

  // stats
  html+=`<div class="statrow">
    <div class="stat"><b>${places.length}</b><span>Places been</span></div>
    <div class="stat"><b>${revCount}</b><span>Reviews</span></div>

  // places been (with their rating)
  html+=`<div class="sect">📍 Where ${isMe?'you\'ve':u.name.split(" ")[0]+"'s"} been</div>

    }).join("")}</div>`;

  // listings owned by this user (created businesses + events) — shareable
  const ownBiz=Object.keys(biz).filter(k=>biz[k].created&&biz[k].owner===id);
  const ownEv=Object.keys(events).filter(k=>events[k].created&&events[k].host===id);
  if(ownBiz.length||ownEv.length){

let mapSort="proximity"; // proximity | close | interacted (for the in-view list)

  </div>
  <div id="inview"><div class="empty">Loading map…</div></div>`);
  initMap();

function setMapSort(m){mapSort=m;updateInView();}
// which pins fall inside the current map viewport
function updateInView(){
  const el=document.getElementById("inview");if(!el)return;
  if(!_leaflet){el.innerHTML='';return;}
  let b; try{b=_leaflet.getBounds();}catch(e){return;}
  const bizIds=Object.keys(biz).filter(k=>geo(k)&&matchQ(biz[k].n,biz[k].cat+" "+biz[k].hood)&&b.contains(geo(k)));
  const evIds=Object.keys(events).filter(k=>geo(k)&&matchQ(events[k].n,events[k].loc)&&b.contains(geo(k)));
  const bz=sortListBy(bizIds), ev=sortListBy(evIds);
  const total=bz.length+ev.length;
  el.innerHTML=`<div class="sect">In view · ${total} place${total===1?'':'s'}</div>
    ${total?`<div class="grid">${ev.map(eventTile).join("")}${bz.map(bizTile).join("")}</div>`
      :'<div class="empty">Nothing in this area — zoom out or pan to see more.</div>'}`;
}
function sortListBy(ids){
  const arr=[...ids];
  if(mapSort==="proximity")arr.sort((a,b)=>(DIST[a]||99)-(DIST[b]||99));
  else if(mapSort==="interacted")arr.sort((a,b)=>(INTERACT[b]||0)-(INTERACT[a]||0));
  else if(mapSort==="close")arr.sort((a,b)=>closeScore(b)-closeScore(a)||(DIST[a]||99)-(DIST[b]||99));
  return arr;
}

let _leaflet=null;
function initMap(){
  if(typeof L==="undefined")return; // library not loaded
  const el=document.getElementById("leafmap");if(!el)return;
  // tear down any prior instance bound to this container
  if(_leaflet){try{_leaflet.remove();}catch(e){}_leaflet=null;}
  setTimeout(()=>{
    const node=document.getElementById("leafmap");if(!node)return;
    const map=L.map(node,{zoomControl:true,attributionControl:true}).setView(GEO._me,13);
    _leaflet=map;
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
      maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    // you-are-here
    L.circleMarker(GEO._me,{radius:7,color:"#00c2a8",fillColor:"#00c2a8",fillOpacity:1,weight:2})
      .addTo(map).bindPopup("📍 You are here");
    // filter by search
    const bizIds=Object.keys(biz).filter(k=>geo(k)&&matchQ(biz[k].n,biz[k].cat+" "+biz[k].hood));
    const evIds=Object.keys(events).filter(k=>geo(k)&&matchQ(events[k].n,events[k].loc));
    const bounds=[GEO._me];
    bizIds.forEach(id=>{const b=biz[id];const g=geo(id);bounds.push(g);
      const mk=L.marker(g).addTo(map);
      mk.bindPopup(`<b>${b.ic} ${b.n}</b><br>${b.cat}<br>★ ${b.r||'new'} · ${miles(id)}<br><a href="#" onclick="ACTIONS.mapOpen('biz','${id}');return false">Open ›</a>`);});
    evIds.forEach(id=>{const e=events[id];const g=geo(id);bounds.push(g);
      const mk=L.marker(g).addTo(map);
      mk.bindPopup(`<b>🎟️ ${e.n}</b><br>${e.date}<br>${miles(id)}<br><a href="#" onclick="ACTIONS.mapOpen('event','${id}');return false">Open ›</a>`);});
    if(bounds.length>1){try{map.fitBounds(bounds,{padding:[30,30],maxZoom:14});}catch(e){}}
    // update the in-view list whenever the map moves or zooms
    map.on("moveend zoomend",updateInView);
    setTimeout(()=>{try{map.invalidateSize();}catch(e){}updateInView();},150);
  },60);
}
